services:
  # 1. DocFlow Backend API Server (Docker Web Service with Sharp & LibreOffice)
  - type: web
    name: docflow-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    context: ./backend
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # 2. DocFlow Frontend Web App (Vite React Static Site)
  - type: static
    name: docflow-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://docflow-backend.onrender.com/api
